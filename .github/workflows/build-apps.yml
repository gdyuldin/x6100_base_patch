name: desktop-apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: dist/X6100-Uploader.exe
            asset: X6100-Uploader-windows.exe
          - os: macos-latest
            out: X6100-Uploader-macos.zip
            asset: X6100-Uploader-macos.zip
          - os: ubuntu-latest
            out: X6100-Uploader-x86_64.AppImage
            asset: X6100-Uploader-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller paramiko Pillow
      - if: runner.os == 'Windows'
        run: app\build-windows.bat
        shell: cmd
      - if: runner.os == 'macOS'
        run: |
          bash app/build-macos.sh
          cd dist && zip -r ../X6100-Uploader-macos.zip X6100-Uploader.app
      - if: runner.os == 'Linux'
        run: bash app/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.out }}
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: X6100 Base Patch Uploader ${{ github.ref_name }}
          files: ${{ matrix.out }}
