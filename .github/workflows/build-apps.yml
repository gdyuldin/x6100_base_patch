name: desktop-apps
# Uploader binaries only. Upstream firmware releases use r* tags and are never
# touched: this runs on v*/app-v* tags and on manual dispatch, attaches assets
# to RELEASE_TAG, and uses make_latest: false so the newest r* release stays
# "Latest".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (binaries land on that release)"
        required: true
        default: "uploader-latest"
  push:
    tags: ["v*", "app-v*"]

permissions:
  contents: write

env:
  # Tag pushes use the pushed tag; manual runs use the input (default uploader-latest).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: dist/X6100-Uploader.exe
            asset: X6100-Uploader-windows.exe
          - os: macos-latest
            out: X6100-Uploader-macos-arm64.dmg
            asset: X6100-Uploader-macos-arm64.dmg
          - os: ubuntu-latest
            out: X6100-Uploader-x86_64.AppImage
            asset: X6100-Uploader-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller paramiko Pillow
      - if: runner.os == 'Windows'
        run: app\build-windows.bat
        shell: cmd
      - if: runner.os == 'macOS'
        run: |
          bash app/build-macos.sh
          STAGE=dmg-stage && rm -rf $STAGE && mkdir -p $STAGE && cp -R "dist/X6100-Uploader.app" $STAGE/ && ln -s /Applications $STAGE/Applications
          hdiutil create -volname "Xiegu X6100 Base Patch Firmware Uploader" -srcfolder $STAGE -ov -format UDZO X6100-Uploader-macos-arm64.dmg
      - if: runner.os == 'Linux'
        run: bash app/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.out }}
          if-no-files-found: error
      # make_latest: false keeps the newest firmware release (r*) as "Latest",
      # so /releases/latest still resolves to a .xgf for the installers.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Xiegu X6100 Base Patch Firmware Uploader ${{ env.RELEASE_TAG }}
          make_latest: false
          files: ${{ matrix.out }}
