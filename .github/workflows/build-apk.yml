name: android-apk
# Uploader binaries only. Upstream firmware releases use r* tags and are never
# touched: this runs on v*/app-v* tags and on manual dispatch, attaches the APK
# to RELEASE_TAG, and uses make_latest: false so the newest r* release stays
# "Latest".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (APK lands on that release)"
        required: true
        default: "uploader-latest"
  push:
    tags: ["v*", "app-v*"]

permissions:
  contents: write

env:
  # Tag pushes use the pushed tag; manual runs use the input (default uploader-latest).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk unzip zip git ccache cmake wget \
            autoconf automake autopoint libtool libtool-bin libltdl-dev pkg-config \
            zlib1g-dev libffi-dev libssl-dev libncurses-dev
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: bash app-android/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: X6100-Uploader.apk
          path: app-android/bin/*.apk
          if-no-files-found: error
      # make_latest: false keeps the newest firmware release (r*) as "Latest".
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Xiegu X6100 Base Patch Firmware Uploader ${{ env.RELEASE_TAG }}
          make_latest: false
          files: app-android/bin/*.apk
